[project]
name = "obsidian-second-brain-research"
version = "0.8.0"
description = "Research toolkit for obsidian-second-brain — Grok, Perplexity, Gemini, and YouTube research that saves to your vault"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "youtube-transcript-api>=0.6.2",
    "google-api-python-client>=2.110.0",
    "google-genai>=2.3.0",
]

# Fork-only optional extras. Install with:
#   uv sync --extra pdf       (for /research-paper PDF parsing)
#   uv sync --all-extras      (install everything)
[project.optional-dependencies]
pdf = ["pymupdf>=1.24.0"]

[tool.ruff]
line-length = 100
target-version = "py310"
